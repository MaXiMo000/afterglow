# cooldown: wait 7 days before proposing a new release, so a hijacked release has time to be caught
# (security updates are not delayed).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    ignore:
      # @types/node must match the Node major we run (24: CI, engines); bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directories: [/backend]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
