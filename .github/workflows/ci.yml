# Required checks on main: backend, frontend, gitleaks (scripts/harden-repo.sh). Keep these job names stable.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: git >= 2.44 (needed for --no-lazy-fetch)
        run: git --version && git --no-lazy-fetch version
      - name: Install (hash-pinned)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy --strict app core worker egress
      - name: Bandit
        run: bandit -q -r app core worker egress
      - name: Tests (with Postgres)
        run: |
          env_lines="$(../scripts/test-db.sh)"  # assignment fails the step if the script fails
          eval "$env_lines"
          pytest
      - name: Dependency audit
        run: pip-audit -r requirements-dev.lock --require-hashes --disable-pip --strict

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile, no install scripts)
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build + bundle policy check
        working-directory: frontend
        run: npm run build
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Start stack (Caddy + API + Postgres)
        run: |
          scripts/dev-env.sh
          docker compose -f deploy/compose.yaml up -d --build --wait
      - name: Security headers
        run: bash deploy/check-headers.sh
      - name: Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E (CSP, Trusted Types, same-origin only)
        working-directory: frontend
        run: npm run e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          -c 'git config --global --add safe.directory /repo && gitleaks git /repo --redact --no-banner --exit-code 1'
