# Release on a v* tag (SECURITY section 8): build the frontend bundle and the three images, publish the images to
# GHCR by digest, generate CycloneDX SBOMs, attest build provenance for every artifact, and attach it all to a
# GitHub release. Tags are created by the owner; nothing here runs on pull requests.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release
      packages: write # push images to ghcr.io
      id-token: write # OIDC for signing attestations
      attestations: write # store attestations
    env:
      TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tag matches a commit on main
        run: |
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }

      - name: Frontend bundle
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
          mkdir -p ../dist-release
          tar -C dist -czf "../dist-release/afterglow-frontend-$TAG.tar.gz" .
          npm sbom --sbom-format cyclonedx --omit dev > "../dist-release/afterglow-frontend-$TAG.sbom.cdx.json"

      - name: Python SBOM (from the hash lock)
        # Trivy only recognises the requirements.txt name; scanning requirements.lock directly yields an empty SBOM.
        run: |
          mkdir -p sbom-py && cp backend/requirements.lock sbom-py/requirements.txt
          docker run --rm -v "$PWD:/src" "$TRIVY" fs --format cyclonedx \
            --output "/src/dist-release/afterglow-backend-$TAG.sbom.cdx.json" /src/sbom-py

      - name: Build and push images
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          : > dist-release/images.txt
          for svc in api worker egress; do
            ref="ghcr.io/$owner/afterglow-$svc"
            docker build -t "$ref:$TAG" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" -f "backend/Dockerfile.$svc" backend
            docker push -q "$ref:$TAG"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref:$TAG" | cut -d@ -f2)"
            echo "$ref@$digest" >> dist-release/images.txt
            echo "${svc}_name=$ref" >> "$GITHUB_OUTPUT"
            echo "${svc}_digest=$digest" >> "$GITHUB_OUTPUT"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/dist-release:/out" "$TRIVY" \
              image --format cyclonedx --output "/out/afterglow-$svc-$TAG.sbom.cdx.json" "$ref:$TAG"
          done
          docker logout ghcr.io
          cat dist-release/images.txt

      - name: SBOMs are not empty
        run: |
          for f in dist-release/*.sbom.cdx.json; do
            n="$(jq '[.components // [] | .[]] | length' "$f")"
            echo "$f: $n components"
            [ "$n" -gt 0 ] || { echo "::error::$f lists no components"; exit 1; }
          done

      - name: Scan the release images (same gate as CI)
        run: |
          while read -r img; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" \
              image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$img"
          done < dist-release/images.txt

      - name: Provenance for release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-release/*
      - name: Provenance for api image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.api_name }}
          subject-digest: ${{ steps.images.outputs.api_digest }}
          push-to-registry: true
      - name: Provenance for worker image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.worker_name }}
          subject-digest: ${{ steps.images.outputs.worker_digest }}
          push-to-registry: true
      - name: Provenance for egress image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.egress_name }}
          subject-digest: ${{ steps.images.outputs.egress_digest }}
          push-to-registry: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist-release && sha256sum -- * > SHA256SUMS)
          {
            echo "Images (pin these digests, not the tag):"
            echo '```'
            cat dist-release/images.txt
            echo '```'
            echo "Every file and image has a build provenance attestation:"
            echo '`gh attestation verify <file> --repo '"$GITHUB_REPOSITORY"'` or `gh attestation verify oci://<image@digest> --repo '"$GITHUB_REPOSITORY"'`'
            echo
            echo "SBOMs are CycloneDX JSON. Security evidence: docs/SECURITY-EVIDENCE.md."
          } > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md dist-release/*
