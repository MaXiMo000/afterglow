# Local stack: Caddy (TLS + headers + static) -> API. Worker is isolated on its own network (A1 adds egress policy).
# Build the frontend first (`npm run build` in frontend/), then: docker compose -f deploy/compose.yaml up -d --build --wait
name: afterglow

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  restart: unless-stopped

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    # The image's caddy binary carries a file capability; exec fails if the bounding set lacks it.
    cap_add: [NET_BIND_SERVICE]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/www:ro
      - caddy_data:/data
    tmpfs: [/config, /tmp]
    networks: [edge, backend]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 256m

  api:
    <<: *hardening
    build: { context: ../backend, dockerfile: Dockerfile.api }
    environment:
      AFTERGLOW_ENV: prod
      AFTERGLOW_ALLOWED_HOSTS: localhost,api
      AFTERGLOW_PUBLIC_ORIGIN: https://localhost:8443
    tmpfs: [/tmp]
    networks: [backend]
    mem_limit: 512m

  # One-shot until A2 adds the queue: docker compose -f deploy/compose.yaml run --rm worker owner/name
  worker:
    <<: *hardening
    build: { context: ../backend, dockerfile: Dockerfile.worker }
    profiles: [worker]
    restart: "no"
    environment:
      AFTERGLOW_GIT_PROXY: http://egress:3128
    # Scratch is tmpfs, capped; clones never touch a persistent disk. Store holds only schema-valid results.
    tmpfs: ["/scratch:size=1100m,uid=10002,gid=10002,mode=0700"]
    volumes: ["worker_store:/store"]
    networks: [worker]  # internal: no route anywhere except the egress proxy
    depends_on:
      egress: { condition: service_started }
    mem_limit: 1g
    cpus: 1.0

  egress:
    <<: *hardening
    build: { context: ../backend, dockerfile: Dockerfile.egress }
    profiles: [worker]
    networks: [worker, egress]
    mem_limit: 128m
    pids_limit: 32

networks:
  edge: {}
  backend: { internal: true }
  worker: { internal: true }
  egress: {}

volumes:
  caddy_data: {}
  worker_store: {}
