# Local stack: Caddy (TLS + headers + static) -> API -> Postgres <- worker -> egress proxy -> github.com.
# First run: scripts/dev-env.sh (random secrets into deploy/.env), build the frontend (`npm run build` in
# frontend/), then: docker compose -f deploy/compose.yaml --profile worker up -d --build --wait
name: afterglow

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  restart: unless-stopped
  # Bounded logs (frontend/privacy.html): at most 3 x 10 MB per service, oldest dropped first.
  logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    # The image's caddy binary carries a file capability; exec fails if the bounding set lacks it.
    cap_add: [NET_BIND_SERVICE]
    # Local defaults; on a server set AFTERGLOW_SITE, AFTERGLOW_PORT=443, AFTERGLOW_BIND=0.0.0.0 and
    # AFTERGLOW_TLS=<email for Let's Encrypt> in deploy/.env (see README "Deploy").
    environment:
      AFTERGLOW_SITE: ${AFTERGLOW_SITE:-localhost}
      AFTERGLOW_PORT: ${AFTERGLOW_PORT:-8443}
      AFTERGLOW_TLS: ${AFTERGLOW_TLS:-internal}
    ports: ["${AFTERGLOW_BIND:-127.0.0.1}:${AFTERGLOW_PORT:-8443}:${AFTERGLOW_PORT:-8443}"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/www:ro
      - caddy_data:/data
    tmpfs: [/config, /tmp]
    networks: [edge, backend]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 256m

  api:
    <<: *hardening
    build: { context: ../backend, dockerfile: Dockerfile.api }
    environment:
      AFTERGLOW_ENV: prod
      AFTERGLOW_ALLOWED_HOSTS: ${AFTERGLOW_SITE:-localhost},api
      AFTERGLOW_PUBLIC_ORIGIN: ${AFTERGLOW_PUBLIC_ORIGIN:-https://localhost:8443}
      AFTERGLOW_DATABASE_URL: postgresql://afterglow_api:${AFTERGLOW_DB_API_PASSWORD:?run scripts/dev-env.sh}@db/afterglow
      AFTERGLOW_IP_KEY: ${AFTERGLOW_IP_KEY:?run scripts/dev-env.sh}
    tmpfs: [/tmp]
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m

  db:
    <<: *hardening
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    # The entrypoint starts as root to fix data-dir ownership, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: afterglow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-env.sh}
      AFTERGLOW_DB_API_PASSWORD: ${AFTERGLOW_DB_API_PASSWORD:?run scripts/dev-env.sh}
      AFTERGLOW_DB_WORKER_PASSWORD: ${AFTERGLOW_DB_WORKER_PASSWORD:?run scripts/dev-env.sh}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql.in:ro
    tmpfs: [/tmp, /var/run/postgresql]
    networks: [backend, worker]  # API and worker both need it; it has no route out (both are internal)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d afterglow"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  worker:
    <<: *hardening
    build: { context: ../backend, dockerfile: Dockerfile.worker }
    profiles: [worker]
    command: ["serve"]
    environment:
      AFTERGLOW_GIT_PROXY: http://egress:3128
      AFTERGLOW_WORKER_DATABASE_URL: postgresql://afterglow_worker:${AFTERGLOW_DB_WORKER_PASSWORD:?run scripts/dev-env.sh}@db/afterglow
    # Scratch is tmpfs, capped; clones never touch a persistent disk. Fresh directory per job.
    tmpfs: ["/scratch:size=1100m,uid=10002,gid=10002,mode=0700"]
    networks: [worker]  # internal: only the egress proxy and the database are reachable
    depends_on:
      egress: { condition: service_started }
      db: { condition: service_healthy }
    mem_limit: 1g
    cpus: 1.0

  egress:
    <<: *hardening
    build: { context: ../backend, dockerfile: Dockerfile.egress }
    profiles: [worker]
    networks: [worker, egress]
    mem_limit: 128m
    pids_limit: 32

networks:
  edge: {}
  backend: { internal: true }
  worker: { internal: true }
  egress: {}

volumes:
  caddy_data: {}
  db_data: {}
