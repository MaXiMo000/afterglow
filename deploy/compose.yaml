# Local stack: Caddy (TLS + headers + static) -> API -> Postgres <- worker -> egress proxy -> github.com.
# First run: scripts/dev-env.sh (random secrets into deploy/.env), build the frontend (`npm run build` in
# frontend/), then: docker compose -f deploy/compose.yaml --profile worker up -d --build --wait
name: afterglow

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  restart: unless-stopped
  # Bounded logs (frontend/privacy.html): at most 3 x 10 MB per service, oldest dropped first.
  logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    # The image's caddy binary carries a file capability; exec fails if the bounding set lacks it.
    cap_add: [NET_BIND_SERVICE]
    # Local defaults; on a server set AFTERGLOW_SITE, AFTERGLOW_PORT=443, AFTERGLOW_BIND=0.0.0.0 and
    # AFTERGLOW_TLS=<email for Let's Encrypt> in deploy/.env (see README "Deploy").
    environment:
      AFTERGLOW_SITE: ${AFTERGLOW_SITE:-localhost}
      AFTERGLOW_PORT: ${AFTERGLOW_PORT:-8443}
      AFTERGLOW_TLS: ${AFTERGLOW_TLS:-internal}
    ports: ["${AFTERGLOW_BIND:-127.0.0.1}:${AFTERGLOW_PORT:-8443}:${AFTERGLOW_PORT:-8443}"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/www:ro
      - caddy_data:/data
    tmpfs: [/config, /tmp]
    networks: [edge, backend]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 256m

  api:
    <<: *hardening
    build: { context: ../backend, dockerfile: Dockerfile.api }
    environment:
      AFTERGLOW_ENV: prod
      AFTERGLOW_ALLOWED_HOSTS: ${AFTERGLOW_SITE:-localhost},api
      AFTERGLOW_PUBLIC_ORIGIN: ${AFTERGLOW_PUBLIC_ORIGIN:-https://localhost:8443}
      AFTERGLOW_DATABASE_URL: postgresql://afterglow_api:${AFTERGLOW_DB_API_PASSWORD:?run scripts/dev-env.sh}@db/afterglow
      AFTERGLOW_IP_KEY: ${AFTERGLOW_IP_KEY:?run scripts/dev-env.sh}
      # Start-page gallery (docs/ROADMAP.md #10): up to 12 owner/name, comma-separated. Override in deploy/.env;
      # set it to empty to hide the gallery.
      AFTERGLOW_FEATURED: ${AFTERGLOW_FEATURED-MaXiMo000/afterglow,MaXiMo000/tidewatch,MaXiMo000/playhead,MaXiMo000/parity,MaXiMo000/loom,MaXiMo000/portfolio,fastapi/fastapi,pallets/flask,sveltejs/svelte,vitejs/vite,tokio-rs/tokio,excalidraw/excalidraw}
    tmpfs: [/tmp]
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m

  db:
    <<: *hardening
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    # The entrypoint starts as root to fix data-dir ownership, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: afterglow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-env.sh}
      AFTERGLOW_DB_API_PASSWORD: ${AFTERGLOW_DB_API_PASSWORD:?run scripts/dev-env.sh}
      AFTERGLOW_DB_WORKER_PASSWORD: ${AFTERGLOW_DB_WORKER_PASSWORD:?run scripts/dev-env.sh}
      AFTERGLOW_DB_MAINT_PASSWORD: ${AFTERGLOW_DB_MAINT_PASSWORD:?run scripts/dev-env.sh}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql.in:ro
    tmpfs: [/tmp, /var/run/postgresql]
    networks: [backend, worker]  # API and worker both need it; it has no route out (both are internal)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d afterglow"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  # Retention (frontend/privacy.html): hourly deletes of finished jobs and unused results, as the only role that can
  # delete. Same image as the API; it serves nothing.
  maint:
    <<: *hardening
    build: { context: ../backend, dockerfile: Dockerfile.api }
    command: ["python", "-m", "app.maint"]
    # Healthy while prunes succeed (one per hour; a failed one retries every minute).
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.stat('/tmp/.alive').st_mtime > 7500)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    environment:
      AFTERGLOW_MAINT_DATABASE_URL: postgresql://afterglow_maint:${AFTERGLOW_DB_MAINT_PASSWORD:?run scripts/dev-env.sh}@db/afterglow
    tmpfs: [/tmp]
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 128m
    pids_limit: 16

  worker:
    <<: *hardening
    build: { context: ../backend, dockerfile: Dockerfile.worker }
    profiles: [worker]
    command: ["serve"]
    environment:
      AFTERGLOW_GIT_PROXY: http://egress:3128
      AFTERGLOW_WORKER_DATABASE_URL: postgresql://afterglow_worker:${AFTERGLOW_DB_WORKER_PASSWORD:?run scripts/dev-env.sh}@db/afterglow
    # Scratch is tmpfs, capped; clones never touch a persistent disk. Fresh directory per job. tmpfs pages count
    # against mem_limit: the worker keeps all clones of a job under one 512 MB budget (Caps.pack_bytes), so the
    # size here is that budget plus headroom, leaving the rest of the 1 GB for git and Python.
    tmpfs: ["/scratch:size=600m,uid=10002,gid=10002,mode=0700"]
    # The job loop touches /scratch/.alive every poll and every few seconds during a job.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.stat('/scratch/.alive').st_mtime > 180)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s  # the worker touches the file as soon as it starts polling
    networks: [worker]  # internal: only the egress proxy and the database are reachable
    depends_on:
      egress: { condition: service_started }
      db: { condition: service_healthy }
    mem_limit: 1g
    cpus: 1.0

  egress:
    <<: *hardening
    build: { context: ../backend, dockerfile: Dockerfile.egress }
    profiles: [worker]
    networks: [worker, egress]
    mem_limit: 128m
    pids_limit: 32

networks:
  edge: {}
  backend: { internal: true }
  worker: { internal: true }
  egress: {}

volumes:
  caddy_data: {}
  db_data: {}
