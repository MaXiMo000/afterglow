[project]
name = "afterglow"
version = "0.0.0"
description = "Afterglow API and analysis worker"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.120",
  "uvicorn>=0.38",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx2>=2.13",
  "ruff>=0.14",
  "mypy>=1.18",
  "bandit>=1.8",
  "pip-audit>=2.9",
  "setuptools>=75",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
