[project]
name = "afterglow"
version = "0.0.0"
description = "Afterglow API and analysis worker"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn>=0.38",
  "psycopg[binary]>=3.3",
  "psycopg-pool>=3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "httpx2>=2.13",
  "ruff>=0.16.8",
  "mypy>=2.3.1",
  "bandit>=1.9.4",
  "pip-audit>=2.9",
  "setuptools>=75",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "core*", "worker*", "egress*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PT018", "S104", "E501"]  # tests drive local git fixtures

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
